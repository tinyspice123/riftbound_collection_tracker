name: Create release

on:
  workflow_run:
    workflows: ["Tests / Security / Deploy"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Publish release for deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYED_RUN: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          tag="deploy-${DEPLOYED_RUN}-${DEPLOYED_SHA:0:8}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" --target "$DEPLOYED_SHA" \
            --title "Riftbound ${tag}" --generate-notes --latest
