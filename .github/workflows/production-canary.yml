name: Production dependency canary

on:
  schedule:
    - cron: "30 10 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-export:
    name: Supabase export and local image fallbacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backups/
            /public/img/
            /public/sets.js
            /public/supabase-config.js
            /scripts/backup_supabase.py
            /scripts/validate_data.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Verify database export and committed fallback
        run: |
          python scripts/backup_supabase.py
          python scripts/validate_data.py
          git diff --exit-code -- backups/
