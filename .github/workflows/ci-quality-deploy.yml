name: Tests / Security / Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:site
      - run: node --test tests/unit/*.test.mjs
      - run: npm run test:python
      - run: python scripts/validate_data.py

  database-migrations:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: supabase-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Apply pending Riftbound migrations
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python scripts/migrate_supabase.py

  package-pages:
    name: Package Pages artifact
    needs: [checks, database-migrations]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      backup_count: ${{ steps.package-backups.outputs.backup_count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backups/
            /public/

      - name: Inject service-worker build version
        shell: bash
        run: |
          build_version="shell-${GITHUB_SHA::8}"
          sed -i "s/shell-__BUILD_VERSION__/$build_version/" public/sw.js
          grep -Fq "const VERSION = '$build_version'" public/sw.js
          if grep -Fq 'shell-__BUILD_VERSION__' public/sw.js; then
            echo "Service-worker version placeholder was not fully replaced" >&2
            exit 1
          fi

      - name: Package sheet fallbacks
        id: package-backups
        shell: bash
        run: |
          mkdir -p public/backups
          cp backups/*.csv public/backups/
          backup_count="$(find public/backups -maxdepth 1 -type f -name '*.csv' | wc -l)"
          if [[ "$backup_count" -eq 0 ]]; then
            echo "No backup CSV files were packaged" >&2
            exit 1
          fi
          echo "backup_count=$backup_count" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        # v5, pinned because this step is part of the trusted deployment path.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'public'

  deploy:
    name: Deploy to GitHub Pages

    needs: package-pages
    timeout-minutes: 10

    concurrency:
      group: pages
      cancel-in-progress: false

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Smoke test deployed site
        id: smoke-test
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          smoke() {
            local url="$1" output="$2"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" --output "$output"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          site_root="${SITE_URL%/}"
          smoke "$site_root/index.html" /tmp/index.html & index_pid=$!
          smoke "$site_root/tracker.html" /tmp/tracker.html & tracker_pid=$!
          smoke "$site_root/manifest.json" /dev/null & manifest_pid=$!
          smoke "$site_root/sw.js" /dev/null & worker_pid=$!
          smoke "$site_root/backups/origins.csv" /dev/null & backup_pid=$!
          smoke "$site_root/img/origins/manifest.txt" /dev/null & image_manifest_pid=$!
          wait "$index_pid"
          wait "$tracker_pid"
          wait "$manifest_pid"
          wait "$worker_pid"
          wait "$backup_pid"
          wait "$image_manifest_pid"
          grep -q 'id="sets"' /tmp/index.html
          grep -q 'id="lightbox"' /tmp/tracker.html

      - name: Publish deployment summary
        if: always()
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BACKUP_COUNT: ${{ needs.package-pages.outputs.backup_count }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke-test.outcome }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- **Site:** ${SITE_URL:-Unavailable}"
            echo "- **Commit:** \`${GITHUB_SHA::8}\`"
            echo "- **Quality:** site, unit, Python and data checks passed"
            echo "- **Sheet fallbacks:** ${BACKUP_COUNT} backup CSV files packaged"
            echo "- **Deployment:** ${DEPLOY_OUTCOME}"
            echo "- **Smoke tests:** ${SMOKE_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
