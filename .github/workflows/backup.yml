name: Backup Supabase collection

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Export Supabase collection
        run: python scripts/backup_supabase.py
      - name: Validate backups and local image manifests
        run: python scripts/validate_data.py
      - name: Commit changed snapshots
        id: commit
        shell: bash
        run: |
          git config user.name "riftbound-backup[bot]"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database changes"
          else
            git commit -m "Daily collection backup [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy refreshed fallbacks
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-quality-deploy.yml --ref main
